# Lint every PR and every push to main, test against Postgres on the oldest
# and the latest Prisma 7 the package supports, and check the packed package
# the way a consumer installs it.
name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            if (!/^(feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert)(\([^\r\n]+\))?!?: \S[^\r\n]*$/.test(title)) {
              core.setFailed('Use a conventional PR title, for example fix: handle startup failures or feat!: change the public API.');
            }

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run attw
      - run: bun run publint
      - run: bun run verify:package
      # The fixture DDL is generated from the fixture schema; they must agree.
      - run: bun run fixture:sql && git diff --exit-code test/fixture/schema.sql

  test:
    name: test (Prisma ${{ matrix.prisma }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        prisma: ['7.8.0', '^7']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prisma_typed
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prisma_typed
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: >-
          bun add -d prisma@'${{ matrix.prisma }}' @prisma/client@'${{ matrix.prisma }}'
          @prisma/adapter-pg@'${{ matrix.prisma }}'
      - run: bunx prisma --version | head -2
      - run: bun run typecheck
      - run: bun run test

  consumers:
    name: consumers (${{ matrix.peers }} peers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        peers: [minimum, latest]
    env:
      PEER_PROFILE: ${{ matrix.peers }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:consumers
